services:
  db:
    image: pgvector/pgvector:pg16
    container_name: contextquery_db_final
    environment:
      POSTGRES_USER: cq
      POSTGRES_PASSWORD: cq
      POSTGRES_DB: contextquery
    ports:
      - "55432:5432"
    volumes:
      - pgdata_final:/var/lib/postgresql/data

volumes:
  pgdata_final: